# Runs nine-router.service on the 9router fork with the otterly provider.
# Remove this file, daemon-reload and restart the service to return to the npm package.
[Service]
WorkingDirectory=/home/inigo/.local/share/9router-fork/app
Environment=NODE_ENV=production
Environment=NEXT_TELEMETRY_DISABLED=1
Environment=HOSTNAME=127.0.0.1
Environment=PORT=20128
# The main unit's EnvironmentFile (service.env) also sets HOSTNAME and PORT, and values from an
# EnvironmentFile beat Environment= lines. This file is read after it, so its values win.
EnvironmentFile=/home/inigo/.config/9router-fork/override.env
ExecStart=
ExecStart=/usr/bin/node --dns-result-order=ipv4first --max-old-space-size=6144 /home/inigo/.local/share/9router-fork/app/custom-server.js
